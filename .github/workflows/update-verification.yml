name: Update Dependency Verification

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'gradle/verification-metadata.xml'

jobs:
  update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Discard existing dependency verification metadata
        # --write-verification-metadata merges into an existing file instead of
        # replacing it, so entries for dependencies that left the graph would
        # survive forever. Deleting first keeps the file free of stale entries.
        run: rm -f gradle/verification-metadata.xml

      - name: Regenerate dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 build cyclonedxBom -x test

      - name: Verify regenerated metadata
        # Proves the freshly written file is complete: a build with verification
        # enabled and no --write flag must still succeed.
        run: ./gradlew build -x test

      - name: Commit updated verification metadata
        run: |
            git diff --quiet gradle/verification-metadata.xml || {
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add gradle/verification-metadata.xml
            git commit -m "auto: update dependency verification metadata [skip ci]"
            git push
            }
