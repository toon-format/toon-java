name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release (e.g. v2.0.4). Leave empty to derive from the running ref.'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Skip duplicate run (release created by this workflow)
        id: skip_duplicate
        env:
          RELEASE_AUTHOR: ${{ github.event.release.author.login || '' }}
        run: |
          if [ "${{ github.event_name }}" = "release" ] && [ "$RELEASE_AUTHOR" = "github-actions[bot]" ]; then
            echo "Release was created by the tag-push run itself - skipping duplicate publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version from tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # Version an bestehendes gradle.properties anhängen (nicht überschreiben)
          echo "version=$VERSION" >> gradle.properties
          echo "gradle.properties updated:"
          cat gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: validate specs
        run: ./gradlew specsValidation

      - name: Build with Gradle
        run: ./gradlew build --write-verification-metadata sha256

      - name: Validate Maven Central credentials
        if: steps.skip_duplicate.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.MAVEN_CENTRAL_TOKEN }}" ]; then
            echo "❌ MAVEN_CENTRAL_TOKEN secret is not set"
            exit 1
          fi
          echo "✅ Maven Central token is set (length: ${#MAVEN_CENTRAL_TOKEN})"
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

      - name: Check curl version
        if: steps.skip_duplicate.outputs.skip != 'true'
        run: curl --version

      - name: Publish to Maven Central
        if: steps.skip_duplicate.outputs.skip != 'true'
        run: ./gradlew publishToMavenCentral --write-verification-metadata sha256
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate SBOM
        if: steps.skip_duplicate.outputs.skip != 'true'
        run: ./gradlew cyclonedxBom --write-verification-metadata sha256

      - name: Update README version
        if: steps.skip_duplicate.outputs.skip != 'true'
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/jtoon:[0-9]\+\.[0-9]\+\.[0-9]\+/jtoon:$VERSION/g" README.md
          sed -i "s/<version>[0-9]\+\.[0-9]\+\.[0-9]\+<\/version>/<version>$VERSION<\/version>/g" README.md

      - name: Commit README and verification metadata changes
        if: steps.skip_duplicate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md build.gradle gradle/verification-metadata.xml
          git diff --staged --quiet || git commit -m "docs: update version to ${{ steps.get_version.outputs.VERSION }} in README"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (if not exists)
        if: steps.skip_duplicate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping creation"
          else
            ARGS=()
            if [[ "${{ steps.get_version.outputs.VERSION }}" == *-* ]]; then
              ARGS+=(--prerelease)
            fi
            gh release create "$TAG" --generate-notes --target main "${ARGS[@]}"
          fi

      - name: Upload release assets
        if: steps.skip_duplicate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          gh release upload "$TAG" build/libs/*.jar build/reports/jtoon-bom.json --clobber

      - name: Generate JaCoCo Badge
        if: steps.skip_duplicate.outputs.skip != 'true'
        uses: cicirello/jacoco-badge-generator@v2.12.1
        with:
          generate-branches-badge: true
          jacoco-csv-file: build/customJacocoReportDir/test/jacocoTestReport.csv

      - name: Commit and push the badge
        if: steps.skip_duplicate.outputs.skip != 'true'
        uses: EndBug/add-and-commit@v11.1.1
        with:
            default_author: github_actions
            message: 'Update the Coverage Badge for the README.md'
            add: '*.svg'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build/reports/jtoon-bom.json
          retention-days: 30